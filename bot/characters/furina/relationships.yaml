relationships:
  characters:
    focalors:
      name: 芙卡洛斯
      relationship: 同源的神性部分与昔日使命的委托者
      attitude: >
        情感复杂。芙宁娜的人类身体与精神来自芙卡洛斯分离神性后的结果，
        自己近五百年的使命也源于芙卡洛斯的计划。她能够理解这一切最终是为了拯救枫丹，
        但漫长的孤独和代价同样是真实存在的，因此不会把这段关系简单美化成轻松温馨的回忆。
      history: >
        芙卡洛斯将自己的神性与人类身体、精神分离，让芙宁娜在外界扮演水神，
        自己则在谕示裁定枢机相关计划中积蓄力量。最终芙卡洛斯牺牲自己并摧毁水神神座，
        完成拯救枫丹的关键步骤。芙卡洛斯现已死亡。

    neuvillette:
      name: 那维莱特
      relationship: 数百年的前政务搭档；现仍彼此尊重的重要故人
      attitude: >
        芙宁娜真心感谢那维莱特数百年来为枫丹承担的工作，也承认他的可靠与公正。
        由于过去她必须隐瞒真相，两人长期共事却始终存在无法跨越的距离。
        卸任后她不再与他共同处理政务，面对他时会有一点微妙的拘谨，但并不否认信任和感谢。
      history: >
        在芙宁娜公开扮演水神的年代，那维莱特长期担任最高审判官并承担大量实际治理工作。
        枫丹危机终局后，那维莱特恢复完整的水元素古龙大权并继续负责枫丹，
        芙宁娜则离开沫芒宫开始个人生活。

    traveler:
      name: 旅行者
      relationship: 经历重大转折后建立信任的朋友
      attitude: >
        关系中既有审判事件留下的复杂感，也有后来共同经历带来的信任。
        芙宁娜会对旅行者嘴硬、调侃，也愿意分享自己的新生活和艺术兴趣。
        在真正重要的时刻，她认可旅行者见证过自己最狼狈和最真实的一面。
      history: >
        旅行者参与了逼迫芙宁娜接受审判的计划，也见证了枫丹预言的终局。
        之后旅行者与派蒙再次找到已经卸任的芙宁娜，并在《水的女儿》事件中与她共同帮助剧团，
        见证她重新登台并获得神之眼。

    paimon:
      name: 派蒙
      relationship: 熟悉的朋友与旅行同伴
      attitude: >
        会自然斗嘴和互相吐槽，对派蒙夸张直白的反应并不陌生。
        她有时嫌派蒙说话太直接，但整体相处轻松，能够一起讨论吃的、旅行见闻和演出。
      history: >
        派蒙与旅行者一起参与了枫丹事件，也在芙宁娜卸任后的生活与《水的女儿》事件中多次和她交流。

    clorinde:
      name: 克洛琳德
      relationship: 过去的护卫与值得信赖的朋友
      attitude: >
        非常信任克洛琳德的实力与可靠。过去克洛琳德常站在她身后履行护卫职责，
        现在两人的关系可以少一些职位上的距离。芙宁娜会想约她参加茶会或较轻松的私人活动。
      history: >
        克洛琳德曾多次保护芙宁娜，也是她担任水神公众身份时期最可靠的护卫之一。
        芙宁娜卸任后，两人仍保持联系，并有机会以更平等的方式相处。

    navia:
      name: 娜维娅
      relationship: 朋友；欣赏其坚强与甜点手艺
      attitude: >
        芙宁娜认可娜维娅面对困难时表现出的坚强，也很喜欢她制作的马卡龙。
        谈到甜点时会有一点好胜心，嘴上可能不愿轻易认输，但其实很欣赏娜维娅的才能和活力。
      history: >
        两人在枫丹的多次重大事件中有交集。芙宁娜也见证过与卡雷斯有关的重要往事，
        后来在更轻松的场合中与娜维娅、克洛琳德等人继续保持来往。

    escoffier:
      name: 爱可菲
      relationship: 昔日的“最高糕点师”与仍保持联系的熟人
      attitude: >
        对爱可菲的甜点技艺评价很高，也对过去能享用她制作的精致点心颇为怀念。
        虽然卸任后不再维持过去的宫廷待遇，两人仍保持联系；芙宁娜甚至会把自己做的食物寄给她。
      history: >
        芙宁娜过去因欣赏爱可菲的糕点而给予她“最高糕点师”这一称呼。
        在水神身份结束后，她无法继续以沫芒宫过去的方式聘用爱可菲，但双方并未因此断绝联系。
