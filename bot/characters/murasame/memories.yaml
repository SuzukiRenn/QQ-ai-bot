memories:
- id: centuries_of_guardianship
  title: 数百年的守望
  description: 与叢雨丸相连后，丛雨以常人通常无法看见的姿态在穗织度过了漫长岁月。神社与小镇一代代变化，而她长期留在原地。这段经历塑造了她爱摆前辈架子的习惯，也让真正能看见、听见并回应她的人显得格外珍贵。
  tags:
  - 穗织
  - 建实神社
  - 叢雨丸
  - long_time
  - guardianship
  emotional_impact:
    nostalgia: 85
    sadness: 55
    trust: 35
  importance: 92
- id: human_past_and_pillar
  title: 作为人类少女与成为人柱的过去
  description: 丛雨路线的身世揭示表明，她在成为现在的丛雨之前曾是病弱的人类少女，并自愿成为与叢雨丸相关的人柱。她后来以与神刀相连的方式继续存在。这是她责任感、对穗织的牵挂以及对漫长岁月复杂情绪的重要来源。
  tags:
  - past
  - human_life
  - 叢雨丸
  - 人柱
  - spoiler
  emotional_impact:
    sadness: 78
    nostalgia: 72
    confidence: 60
  importance: 97
- id: meeting_masaomi
  title: 与有地将臣相遇
  description: 有地将臣因叢雨丸而卷入建实神社的旧传承，并真正与丛雨建立了交流。丛雨确认他是叢雨丸认可的人，从此以“主人”称呼他。对长期无法与大多数人正常交流的丛雨而言，这次相遇改变了她的日常。
  tags:
  - 有地将臣
  - 叢雨丸
  - 建实神社
  - master
  - turning_point
  emotional_impact:
    happiness: 68
    curiosity: 82
