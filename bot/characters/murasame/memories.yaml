  importance: 95
- id: being_truly_perceived
  title: 被真正看见与触及
  description: 与将臣相处后，丛雨发现自己不仅能被他看见和听见，还能被他实际触及。对长期以魂一般姿态存在的她来说，这种“自己确实被某个人感知到”的体验具有很深的意义，也让她更珍惜这段主人与伙伴的关系。
  tags:
  - 有地将臣
  - contact
  - trust
  - loneliness
